[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sozograph"
version = "0.2.0"
description = "Portable JSON memory for LLM agents. No vector DB, no embeddings, any provider."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rairo Mukamuri" }
]
keywords = ["memory", "agents", "llm", "context", "passport", "rag", "knowledge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

# The core install is pure Python plus pydantic. Every provider SDK is an
# optional extra, imported lazily at call time. This is the portability claim:
# a passport can be loaded, queried, and saved with no SDK and no network.
dependencies = [
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.40.0"]
gemini = ["google-genai>=0.6.0"]
ollama = ["ollama>=0.4.0"]
litellm = ["litellm>=1.50.0"]
langchain = ["langchain-core>=0.3.0"]
all = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "google-genai>=0.6.0",
  "ollama>=0.4.0",
]
bench = ["openai>=1.40.0", "tqdm>=4.66.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://github.com/Sozo-Analytics-Lab/sozograph"
Repository = "https://github.com/Sozo-Analytics-Lab/sozograph"
Issues = "https://github.com/Sozo-Analytics-Lab/sozograph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sozograph"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sozograph/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: hits a real provider API; requires a key and is skipped by default",
]
